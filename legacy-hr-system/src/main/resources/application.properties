# ═══════════════════════════════════════════════════════════════════════
# legacy-hr-system — systeme RH legacy exposant un service SOAP
# ═══════════════════════════════════════════════════════════════════════

# ─── Serveur ───
# WSDL accessible a : http://localhost:8080/ws/hr-service.wsdl
server.port=8080
spring.application.name=legacy-hr-system

# ─── Base de donnees relationnelle ───
# H2 en memoire : aucune installation requise, les tables sont recreees a
# chaque demarrage puis alimentees par data.sql. Pour une base persistante,
# remplacer l'URL par jdbc:h2:file:./data/hrdb
spring.datasource.url=jdbc:h2:mem:legacyhr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ───
# ddl-auto=create : le schema est genere a partir des entites JPA, ce qui
# materialise exactement les tables employee et employee_skill de l'annexe.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Indispensable pour que data.sql soit joue APRES la creation du schema
# par Hibernate (sinon les INSERT echouent : table inexistante).
spring.jpa.defer-datasource-initialization=true

# ─── Jackson ───
spring.jackson.default-property-inclusion=non_null

# ─── Logging ───
logging.level.org.springframework.ws=INFO
logging.level.com.upg.legacyhr=DEBUG
